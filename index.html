<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VK Video test in MAX</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f4f5f7;
      color: #111;
    }

    .card {
      max-width: 700px;
      margin: 0 auto;
      background: #fff;
      border-radius: 20px;
      padding: 16px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 24px;
    }

    .meta {
      margin-bottom: 16px;
      color: #777;
      font-size: 15px;
    }

    .video {
      width: 100%;
      aspect-ratio: 16 / 9;
      border-radius: 16px;
      overflow: hidden;
      background: #000;
    }

    iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
    }

    button {
      width: 100%;
      margin-top: 16px;
      padding: 15px;
      border: 0;
      border-radius: 14px;
      font-size: 17px;
      font-weight: 600;
    }

    #status {
      margin-top: 12px;
      text-align: center;
      color: #555;
    }
  </style>
</head>

<body>
  <div class="card">
    <h1>Сегодняшняя тренировка</h1>

    <div class="meta">
      20 минут · дома · силовая
    </div>

    <div class="video">
      <iframe
        src="<https://vkvideo.ru/video_ext.php?oid=-161026765&id=456243315&hd=3" width="1280" height="720" allow="autoplay; encrypted-media; fullscreen; picture-in-picture; screen-wake-lock;" frameborder="0" allowfullscreen>"
        allow="autoplay; encrypted-media; fullscreen; picture-in-picture"
        allowfullscreen>
      </iframe>
    </div>

    <button id="done">
      ✅ Я закончила тренировку
    </button>

    <div id="status"></div>
  </div>

  <script>
    document.getElementById("done").addEventListener("click", () => {
      document.getElementById("status").textContent =
        "Готово! Тренировка отмечена.";
    });
  </script>
</body>
</html>
